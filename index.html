    {

      "title": "Taiwan Assurance Implementation Act",
      "cleanTitle": "Taiwan Assurance Implementation Act",
      "summary": "Taiwan Assurance Implementation ActThis bill expands an existing requirement for the Department of State to review and report on its guidance to federal agencies on the U.S.-Taiwan relationship. (The U.S.-Taiwan relationship has been unofficial since 1979, when the United States established diplomatic relations with China and broke them with Taiwan.)Current law requires the State Department to conduct a one-time review of its guidance governing relations with Taiwan and report to Congress on this review. Under this bill, the State Department must review that guidance, reissue it, and report to Congress every five years while the guidance is in effect.The reports to Congress must (1) describe the results of the guidance review and any changes to it resulting from implementation of a law that encourages engagement between Taiwanese and U.S. officials; (2) describe how the guidance takes into account certain considerations, such as the sense of Congress that Taiwan is governed by a representative government peacefully constituted through free and fair elections; and (3) identify self-imposed restrictions on relations with Taiwan that the State Department has lifted in its most recent guidance update.",

      "title": "National Defense Authorization Act for Fiscal Year 2026",
      "cleanTitle": "National Defense Authorization Act for Fiscal Year 2026",
      "summary": "National Defense Authorization Act for Fiscal Year 2026This bill sets forth policies and authorities for FY2026 for Department of Defense (DOD) programs and activities, military construction, and the national security programs of the Department of Energy (DOE). The bill also sets forth policies and authorities for the Department of State, the Coast Guard, and the Intelligence Community (IC).Among other elements, the billauthorizes the procurement of various items, including aircraft, ships, and missiles;sets active duty and reserve component personnel strength levels;sets policy regarding various aspects of military health care and military compensation;sets policy regarding DOD acquisitions and acquisition management, including contracting authorities and domestic sourcing;sets policy for various matters related to DOD interactions with foreign nations, including matters concerning Israel, Ukraine, and the Indo-Pacific;sets policy for various matters related to DOD cyber operations, cybersecurity, and artificial intelligence;authorizes specified military construction projects and extends the authorization of certain projects from previous fiscal years;authorizes the National Nuclear Security Administration, Defense Nuclear Facilities Safety Board, Naval Petroleum Reserves, and Maritime Administration;sets policy regarding the organization and workforce of the State Department;sets acquisition and personnel policy for the Coast Guard;&nbsp;sets policy for merchant mariner credentials, vessel safety, and oil pollution response; andsets policy for the IC regarding artificial intelligence and biotechnology.For additional information on the National Defense Authorization Act (NDAA) seeIn Focus IF10516, Defense Primer: Navigating the&nbsp;NDAA, andIn Focus IF10515, Defense Primer: The&nbsp;NDAA Process.",

      "cleanTitle": "Taiwan Assurance Implementation Act",
      "summary": "This bill modifies an existing requirement for the Department of State to review and report on its guidance to federal agencies on the U.S.-Taiwan relationship. (The U.S.-Taiwan relationship has been unofficial since 1979, when the United States established diplomatic relations with China and broke them with Taiwan.)Current law requires the State Department to conduct a one-time review of its guidance governing relations with Taiwan and report to Congress on this review. Under this bill, the State Department must review that guidance and report to Congress every two years while the guidance is in effect.The reports to Congress must (1) describe how the guidance takes into account certain considerations, such as the sense of Congress that Taiwan is governed by a representative government peacefully constituted through free and fair elections; and (2) identify opportunities and plans to lift self-imposed restrictions on relations with Taiwan.",

<body class="min-h-screen antialiased selection:bg-blue-500 selection:text-white">
  <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6"></div>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-content" class="bg-slate-900 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden"></div>
  </div>

  <script>
    const state = {
      data: window.TAIWAN_BILLS_DATA || null,
      activeTab: 'explorer', // 'explorer' | 'companions' | 'legislators' | 'dashboard'
      search: '',
      chamberFilter: 'ALL',
      stageFilter: 'ALL',
      themeFilter: 'ALL',
      supportFilter: 'ALL', // 'ALL' | 'BIPARTISAN' | 'COMPANION'
      sortBy: 'cosponsors_desc', // 'cosponsors_desc' | 'action_desc' | 'intro_desc' | 'pending_desc' | 'sheet_order'
      legSearch: '',
      legStateFilter: 'ALL',
      legChamberFilter: 'ALL',
      legPartyFilter: 'ALL',
      syncing: false,
      syncStatusMsg: ''
    };

    const STAGE_BADGES = {
      enacted: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
      passed_chamber: 'bg-sky-500/15 text-sky-300 border-sky-500/30',
      calendar: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
      committee: 'bg-slate-700/50 text-slate-300 border-slate-600/50'
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function partyBadge(party, stateCode, district) {
      const loc = district ? `${stateCode}-${district}` : stateCode;
      if (party === 'R') {
        return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-red-500/15 text-red-300 border border-red-500/30">R-${escapeHtml(loc)}</span>`;
      } else if (party === 'D') {
        return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-blue-500/15 text-blue-300 border border-blue-500/30">D-${escapeHtml(loc)}</span>`;
      }
      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-slate-700 text-slate-300">${escapeHtml(party)}-${escapeHtml(loc)}</span>`;
    }

    async function syncFromGoogleSheet() {
      if (state.syncing) return;
      state.syncing = true;
      state.syncStatusMsg = 'Syncing live rows from Google Sheet...';
      render();
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const fresh = await res.json();
        state.data = fresh;
        state.syncStatusMsg = `Synced ${fresh.totalBills} bills from Google Sheet (${fresh.lastSyncedAt})`;
      } catch (err) {
        state.syncStatusMsg = 'Using local snapshot (run server.rb for live CLI sync)';
      } finally {
        state.syncing = false;
        render();
      }
    }

    function getFilteredBills() {
      if (!state.data) return [];
      const q = state.search.trim().toLowerCase();
      let list = state.data.bills.filter(b => {
        if (state.chamberFilter !== 'ALL' && b.chamber !== state.chamberFilter) return false;
        if (state.stageFilter !== 'ALL' && b.stage.key !== state.stageFilter) return false;
        if (state.themeFilter !== 'ALL' && b.theme !== state.themeFilter) return false;
        if (state.supportFilter === 'BIPARTISAN' && !b.bipartisan) return false;
        if (state.supportFilter === 'COMPANION' && !b.companionBill) return false;
        if (q) {
          const hay = [
            b.billNumber,
            b.shortNumber,
            b.title,
            b.summary,
            b.latestAction,
            b.theme,
            b.sponsor ? b.sponsor.raw : '',
            b.cosponsors.map(c => c.raw).join(' ')
          ].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (state.sortBy === 'cosponsors_desc') return b.cosponsorCount - a.cosponsorCount || a.rowNumber - b.rowNumber;
        if (state.sortBy === 'action_desc') return (b.latestActionDate || '').localeCompare(a.latestActionDate || '');
        if (state.sortBy === 'intro_desc') return (b.dateIntroduced || '').localeCompare(a.dateIntroduced || '');
        if (state.sortBy === 'pending_desc') return b.daysPending - a.daysPending;
        if (state.sortBy === 'stage_desc') return b.stage.step - a.stage.step || b.cosponsorCount - a.cosponsorCount;
        return a.rowNumber - b.rowNumber;
      });
      return list;
    }

    function getFilteredLegislators() {
      if (!state.data) return [];
      const q = state.legSearch.trim().toLowerCase();
      return state.data.legislators.filter(l => {
        if (state.legChamberFilter !== 'ALL' && l.chamber !== state.legChamberFilter) return false;
        if (state.legPartyFilter !== 'ALL' && l.party !== state.legPartyFilter) return false;
        if (state.legStateFilter !== 'ALL' && l.state !== state.legStateFilter) return false;
        if (q) {
          const hay = `${l.displayName} ${l.state} ${l.party}-${l.state} ${l.sponsoredBills.join(' ')} ${l.cosponsoredBills.join(' ')}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function openBillModal(shortNum) {
      const bill = state.data.bills.find(b => b.shortNumber === shortNum);
      if (!bill) return;
      const companion = bill.companionBill ? state.data.bills.find(b => b.shortNumber === bill.companionBill) : null;
      const modal = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');

      const steps = [
        { step: 1, label: 'Introduced & In Committee' },
        { step: 2, label: 'Committee Reported / Calendar' },
        { step: 3, label: 'Passed 1st Chamber / Desk' },
        { step: 4, label: 'Enacted (Public Law)' }
      ];

      const totalSupporters = bill.totalR + bill.totalD;
      const rPct = totalSupporters ? Math.round((bill.totalR / totalSupporters) * 100) : 0;
      const dPct = totalSupporters ? 100 - rPct : 0;

      content.innerHTML = `
        <div class="px-6 py-4 bg-slate-800/80 border-b border-slate-700 flex items-start justify-between gap-4">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-1.5">
              <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-blue-600 text-white">${escapeHtml(bill.billNumber)}</span>
              <span class="px-2 py-0.5 rounded text-xs font-medium border ${STAGE_BADGES[bill.stage.key]}">${escapeHtml(bill.stage.label)}</span>
              <span class="px-2 py-0.5 rounded text-xs bg-slate-700/80 text-slate-300">${escapeHtml(bill.theme)}</span>
              ${bill.bipartisan ? `<span class="px-2 py-0.5 rounded text-xs bg-purple-500/15 text-purple-300 border border-purple-500/30">Bipartisan (${bill.totalR}R / ${bill.totalD}D)</span>` : ''}
            </div>
            <h2 class="text-lg font-bold text-white leading-snug">${escapeHtml(bill.title)}</h2>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700/60 transition">✕</button>
        </div>

        <div class="p-6 overflow-y-auto custom-scroll space-y-5 text-sm">
          <!-- Legislative Progress Stepper -->
          <div class="bg-slate-800/50 border border-slate-700/70 rounded-lg p-4">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Legislative Progress Pipeline</div>
            <div class="grid grid-cols-4 gap-2">
              ${steps.map(s => {
                const active = bill.stage.step >= s.step;
                const current = bill.stage.step === s.step;
                return `
                  <div class="flex flex-col">
                    <div class="h-2 rounded-full mb-2 ${active ? (bill.stage.step === 4 ? 'bg-emerald-500' : 'bg-blue-500') : 'bg-slate-700'}"></div>
                    <span class="text-xs ${current ? 'text-white font-semibold' : (active ? 'text-slate-300' : 'text-slate-500')}">${s.step}. ${escapeHtml(s.label)}</span>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="mt-3 pt-3 border-t border-slate-700/60 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-300">
              <div><span class="text-slate-400">Latest Action (${escapeHtml(bill.latestActionDate)}):</span> ${escapeHtml(bill.latestAction)}</div>
              <div class="font-mono text-slate-400">Introduced: ${escapeHtml(bill.dateIntroduced)} · ${bill.daysPending} days pending</div>
            </div>
          </div>

          <!-- Summary -->
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Summary & Policy Impact</h3>

    function exportFilteredCsv() {
      const bills = getFilteredBills();
      const headers = ['Bill Number', 'Title', 'Chamber', 'Stage', 'Theme', 'Sponsor', 'Cosponsor Count', 'Republican Support', 'Democratic Support', 'Date Introduced', 'Days Pending', 'Latest Action Date', 'Latest Action', 'Congress.gov Link'];
      const rows = bills.map(b => [
        b.billNumber,
        b.title,
        b.chamber,
        b.stage.label,
        b.theme,
        b.sponsor ? b.sponsor.raw : '',
        b.cosponsorCount,
        b.totalR,
        b.totalD,
        b.dateIntroduced,
        b.daysPending,
        b.latestActionDate,
        b.latestAction,
        b.link
      ]);
      const csv = [headers, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'congress_taiwan_bills_filtered.csv';
      a.click();
    }

            seen.add(b.shortNumber);
            seen.add(other.shortNumber);
            const senateBill = b.chamber === 'Senate' ? b : other;
            const houseBill = b.chamber === 'House' ? b : other;

      const states = ['ALL', ...new Set(state.data.legislators.map(l => l.state).filter(Boolean).sort())];

      return `
        <div class="space-y-4">
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-base font-bold text-white">Congressional Taiwan Champions & Constituent Lookup (${state.data.totalLegislators} Lawmakers)</h2>
                <p class="text-xs text-slate-400">Click any Senator or Representative to see every Taiwan bill they sponsor/cosponsor and bills to request in constituent meetings.</p>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 pt-1">
              <div class="sm:col-span-5">
                <input
                  type="text"
                  value="${escapeHtml(state.legSearch)}"
                  oninput="state.legSearch = this.value; renderLegislatorTableOnly();"
                  placeholder="Search by lawmaker name, state (e.g. CA, NY, TX), or bill..."
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                />
              </div>
              <div class="sm:col-span-3">
                <select onchange="state.legStateFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                  ${states.map(st => `<option value="${st}" ${state.legStateFilter === st ? 'selected' : ''}>${st === 'ALL' ? 'All States / Territories' : 'State: ' + st}</option>`).join('')}
                </select>
              </div>
              <div class="sm:col-span-2">
                <select onchange="state.legChamberFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                  <option value="ALL" ${state.legChamberFilter === 'ALL' ? 'selected' : ''}>Both Chambers</option>
                  <option value="Senate" ${state.legChamberFilter === 'Senate' ? 'selected' : ''}>Senate</option>
                  <option value="House" ${state.legChamberFilter === 'House' ? 'selected' : ''}>House</option>
                </select>
              </div>
              <div class="sm:col-span-2">
                <select onchange="state.legPartyFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                  <option value="ALL" ${state.legPartyFilter === 'ALL' ? 'selected' : ''}>All Parties</option>
                  <option value="R" ${state.legPartyFilter === 'R' ? 'selected' : ''}>Republican (R)</option>
                  <option value="D" ${state.legPartyFilter === 'D' ? 'selected' : ''}>Democratic (D)</option>
                </select>
              </div>
            </div>
          </div>

          <div id="legislators-table-container" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
            ${renderLegislatorRows(legs)}
          </div>
        </div>
      `;
    }

    function renderLegislatorRows(legs) {
      if (legs.length === 0) {
        return `<div class="p-8 text-center text-slate-400">No legislators match your filter criteria.</div>`;
      }
      return `
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-800 text-xs uppercase text-slate-400 bg-slate-950/60">
                <th class="py-3 px-4">Rank</th>
                <th class="py-3 px-4">Lawmaker</th>
                <th class="py-3 px-4">Party / State</th>
                <th class="py-3 px-4">Chamber</th>
                <th class="py-3 px-4 text-center">Sponsored</th>
                <th class="py-3 px-4 text-center">Cosponsored</th>
                <th class="py-3 px-4 text-center">Total Bills</th>
                <th class="py-3 px-4">Key Bills Supported</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800/70">
              ${legs.slice(0, 100).map((l, idx) => `
                <tr onclick="openLegislatorModal('${escapeHtml(l.id)}')" class="cursor-pointer hover:bg-slate-800/60 transition">
                  <td class="py-3 px-4 font-mono text-xs text-slate-500">#${idx + 1}</td>
                  <td class="py-3 px-4 font-semibold text-white hover:text-blue-400">${escapeHtml(l.displayName)}</td>
                  <td class="py-3 px-4">${partyBadge(l.party, l.state, l.district)}</td>
                  <td class="py-3 px-4 text-xs text-slate-300">${escapeHtml(l.chamber)}</td>
                  <td class="py-3 px-4 text-center font-mono ${l.sponsoredCount > 0 ? 'text-emerald-400 font-bold' : 'text-slate-500'}">${l.sponsoredCount}</td>
                  <td class="py-3 px-4 text-center font-mono text-blue-300">${l.cosponsoredCount}</td>
                  <td class="py-3 px-4 text-center">
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-white border border-slate-700">${l.totalInvolvement}</span>
                  </td>
                  <td class="py-3 px-4">
                    <div class="flex flex-wrap gap-1">
                      ${[...l.sponsoredBills, ...l.cosponsoredBills].slice(0, 5).map(bn => `
                        <span class="px-1.5 py-0.5 rounded text-[11px] ${l.sponsoredBills.includes(bn) ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-300'}">${escapeHtml(bn)}</span>
                      `).join('')}
                      ${(l.sponsoredBills.length + l.cosponsoredBills.length) > 5 ? `<span class="text-[11px] text-slate-500">+${(l.sponsoredBills.length + l.cosponsoredBills.length) - 5} more</span>` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDashboardTab() {
      const bills = state.data.bills;
      const stages = [
        { key: 'committee', label: 'In Committee', color: 'bg-slate-500' },
        { key: 'calendar', label: 'Committee Reported / Senate Calendar', color: 'bg-amber-500' },
        { key: 'passed_chamber', label: 'Passed 1st Chamber / Held at Desk', color: 'bg-sky-500' },
        { key: 'enacted', label: 'Enacted (Public Law)', color: 'bg-emerald-500' }
      ];

      const themeCounts = {};
      bills.forEach(b => { themeCounts[b.theme] = (themeCounts[b.theme] || 0) + 1; });
      const topBills = [...bills].sort((a, b) => b.cosponsorCount - a.cosponsorCount).slice(0, 8);

      const stateCounts = {};
      state.data.legislators.forEach(l => {
        if (l.state) stateCounts[l.state] = (stateCounts[l.state] || 0) + l.totalInvolvement;
      });
      const topStates = Object.entries(stateCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <!-- Legislative Pipeline Funnel -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-1">Legislative Pipeline Progression</h3>
            <p class="text-xs text-slate-400 mb-4">Click any stage to filter bills in the Explorer.</p>
            <div class="space-y-3.5">
              ${stages.map(s => {
                const matched = bills.filter(b => b.stage.key === s.key);
                const pct = Math.round((matched.length / bills.length) * 100);
                return `
                  <div onclick="state.stageFilter = '${s.key}'; state.activeTab = 'explorer'; render();" class="cursor-pointer group">
                    <div class="flex justify-between text-xs mb-1">
                      <span class="font-semibold text-slate-200 group-hover:text-blue-400 transition">${escapeHtml(s.label)}</span>
                      <span class="font-mono text-slate-400">${matched.length} bills (${pct}%)</span>
                    </div>
                    <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden">
                      <div style="width:${Math.max(pct, 4)}%" class="${s.color} h-full rounded-full"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Policy Themes Breakdown -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-1">Bills by Strategic Policy Theme</h3>
            <p class="text-xs text-slate-400 mb-4">Click any policy category to filter bills.</p>
            <div class="space-y-3">
              ${Object.entries(themeCounts).sort((a, b) => b[1] - a[1]).map(([theme, count]) => {
                const pct = Math.round((count / bills.length) * 100);
                return `
                  <div onclick="state.themeFilter = '${escapeHtml(theme)}'; state.activeTab = 'explorer'; render();" class="cursor-pointer group">
                    <div class="flex justify-between text-xs mb-1">
                      <span class="font-medium text-slate-200 group-hover:text-blue-400">${escapeHtml(theme)}</span>
                      <span class="font-mono text-slate-400">${count} bills (${pct}%)</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                      <div style="width:${pct}%" class="bg-indigo-500 h-full rounded-full"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Most Cosponsored Bills -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-3">Highest Bipartisan Momentum (By Cosponsors)</h3>
            <div class="space-y-2.5">
              ${topBills.map(b => {
                const maxC = topBills[0].cosponsorCount || 1;
                const w = Math.round((b.cosponsorCount / maxC) * 100);
                return `
                  <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer group">
                    <div class="flex justify-between text-xs mb-1">
                      <span class="text-slate-200 group-hover:text-blue-400 truncate max-w-[75%]"><strong>${escapeHtml(b.shortNumber)}</strong> — ${escapeHtml(b.cleanTitle)}</span>
                      <span class="font-mono text-slate-300">${b.cosponsorCount} (${b.totalR}R/${b.totalD}D)</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                      <div style="width:${w}%" class="bg-gradient-to-r from-red-500 via-purple-500 to-blue-500 h-full"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Most Active State Delegations -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-1">Most Active State Delegations</h3>
            <p class="text-xs text-slate-400 mb-3">Total sponsorships & cosponsorships across all 49 Taiwan bills by state.</p>
            <div class="grid grid-cols-2 gap-2.5">
              ${topStates.map(([st, count], i) => `
                <div onclick="state.legStateFilter = '${st}'; state.activeTab = 'legislators'; render();" class="cursor-pointer p-2.5 rounded-lg bg-slate-950/60 hover:bg-slate-800 border border-slate-800 flex items-center justify-between transition">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono text-slate-500">#${i + 1}</span>
                    <span class="font-bold text-sm text-white">${escapeHtml(st)}</span>
                  </div>
                  <span class="text-xs font-mono text-blue-400">${count} actions</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderBodyOnly() {
      const container = document.getElementById('bills-results-container');
      if (container) {
        container.innerHTML = renderBillCards(getFilteredBills());
      }
    }

    function renderLegislatorTableOnly() {
      const container = document.getElementById('legislators-table-container');
      if (container) {
        container.innerHTML = renderLegislatorRows(getFilteredLegislators());
      }
    }

    function render() {
      const app = document.getElementById('app');
      const d = state.data;
      if (!d) {
        app.innerHTML = `<div class="p-12 text-center text-slate-400">Loading dataset...</div>`;
        return;
      }

      const passedFirst = d.bills.filter(b => b.stage.key === 'passed_chamber').length;

      app.innerHTML = `
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1.5">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Live Google Sheet Backend
                </span>
                <span class="text-xs text-slate-400 font-mono">119th U.S. Congress (2025–2026)</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">U.S. Congress Taiwan Bills Tracker</h1>
              <p class="text-xs sm:text-sm text-slate-400 mt-1">
                Powered directly by your <a href="${escapeHtml(d.spreadsheetUrl)}" target="_blank" rel="noopener" class="text-blue-400 hover:underline">Congress Taiwan Bills Google Sheet ↗</a> — preserving your automated Congress.gov API updates.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button
                onclick="syncFromGoogleSheet()"
                class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition"
              >
                <span>${state.syncing ? '⟳ Syncing Sheet...' : '⟳ Sync from Google Sheet'}</span>
              </button>
              <button
                onclick="exportFilteredCsv()"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition"
              >
                ↓ Export CSV
              </button>
              <a
                href="${escapeHtml(d.spreadsheetUrl)}"
                target="_blank"
                rel="noopener"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition"
              >
                Open Google Sheet ↗
              </a>
            </div>
          </div>
          ${state.syncStatusMsg ? `<div class="mt-2.5 text-xs text-emerald-400 font-mono">${escapeHtml(state.syncStatusMsg)}</div>` : ''}

          <!-- KPI Strip -->
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-5 pt-5 border-t border-slate-800">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Tracked Taiwan Bills</div>
              <div class="text-2xl font-extrabold text-white mt-0.5">${d.totalBills}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">${d.bills.filter(b => b.chamber === 'Senate').length} Senate · ${d.bills.filter(b => b.chamber === 'House').length} House</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Enacted / Advanced</div>
              <div class="text-2xl font-extrabold text-emerald-400 mt-0.5">${d.enactedCount} Law <span class="text-sm font-normal text-sky-400">+ ${passedFirst} Passed 1st</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">PL 119-60 (S.1071) & PL 119-45 (H.R.1512)</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Bipartisan Bills</div>
              <div class="text-2xl font-extrabold text-purple-400 mt-0.5">${d.bipartisanCount} <span class="text-sm font-normal text-slate-400">(${Math.round((d.bipartisanCount / d.totalBills) * 100)}%)</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">Cross-party R & D support</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Companion Bill Pairs</div>
              <div class="text-2xl font-extrabold text-indigo-400 mt-0.5">${d.companionPairsCount} <span class="text-sm font-normal text-slate-400">pairs</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">${d.companionPairsCount * 2} bicameral linked bills</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 col-span-2 sm:col-span-1">
              <div class="text-xs text-slate-400">Active Lawmakers</div>
              <div class="text-2xl font-extrabold text-blue-400 mt-0.5">${d.totalLegislators}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">Sponsors & cosponsors</div>
            </div>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap items-center gap-2 border-b border-slate-800 pb-3">
          ${[
            { id: 'explorer', label: `Bill Explorer (${d.totalBills})` },
            { id: 'companions', label: `Bicameral Companion Pairs (${d.companionPairsCount})` },
            { id: 'legislators', label: `Legislator Leaderboard & Lookup (${d.totalLegislators})` },
            { id: 'dashboard', label: 'Analytics & Pipeline Dashboard' }
          ].map(t => `
            <button
              onclick="state.activeTab = '${t.id}'; render();"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${state.activeTab === t.id ? 'bg-blue-600 text-white shadow' : 'bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800'}"
            >${escapeHtml(t.label)}</button>
          `).join('')}
        </div>

        <!-- Tab Body -->
        <div>
          ${state.activeTab === 'explorer' ? renderExplorerTab() : ''}
          ${state.activeTab === 'companions' ? renderCompanionsTab() : ''}
          ${state.activeTab === 'legislators' ? renderLegislatorsTab() : ''}
          ${state.activeTab === 'dashboard' ? renderDashboardTab() : ''}
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
