ng Israel, Ukraine, and the Indo-Pacific;sets policy for various matters related to DOD cyber operations, cybersecurity, and artificial intelligence;authorizes specified military construction projects and extends the authorization of certain projects from previous fiscal years;authorizes the National Nuclear Security Administration, Defense Nuclear Facilities Safety Board, Naval Petroleum Reserves, and Maritime Administration;sets policy regarding the organization and workforce of the State Department;sets acquisition and personnel policy for the Coast Guard;&nbsp;sets policy for merchant mariner credentials, vessel safety, and oil pollution response; andsets policy for the IC regarding artificial intelligence and biotechnology.For additional information on the National Defense Authorization Act (NDAA) seeIn Focus IF10516, Defense Primer: Navigating the&nbsp;NDAA, andIn Focus IF10515, Defense Primer: The&nbsp;NDAA Process.","Became Public Law No: 119-60.","2025-12-18","Sen. Cornyn, John [R-TX]","1","Sen. Cruz, Ted [R-TX]","2025-03-14","609","https://www.congress.gov/bill/119th-congress/senate-bill/1071"],["[119th] H.R. 1512","Taiwan Assurance Implementation Act","This bill modifies an existing requirement for the Department of State to review and report on its guidance to federal agencies on the U.S.-Taiwan relationship. (The U.S.-Taiwan relationship has been unofficial since 1979, when the United States established diplomatic relations with China and broke them with Taiwan.)Current law requires the State Department to conduct a one-time review of its guidance governing relations with Taiwan and report to Congress on this review. Under this bill, the State Department must review that guidance and report to Congress every two years while the guidance is in effect.The reports to Congress must (1) describe how the guidance takes into account certain considerations, such as the sense of Congress that Taiwan is governed by a representative government peacefully constituted through free and fair elections; and (2) identify opportunities and plans to lift self-imposed restrictions on relations with Taiwan.","Became Public Law No: 119-45.","2025-12-02","Rep. Wagner, Ann [R-MO-2]","3","Rep. Connolly, Gerald E. [D-VA-11], Rep. Lieu, Ted [D-CA-36], Rep. Lawler, Michael [R-NY-17]","2025-02-21","630","https://www.congress.gov/bill/119th-congress/house-bill/1512"],["[119th] S. 3208","Six Assurances to Taiwan Act","Direct statutory text pending CRS summary publication.","Read twice and referred to the Committee on Foreign Relations.","2025-11-19","Sen. Curtis, John R. [R-UT]","4","Sen. Merkley, Jeff [D-OR], Sen. Shaheen, Jeanne [D-NH], Sen. Young, Todd [R-IN], Sen. Bennet, Michael F. [D-CO]","2025-11-19","359","https://www.congress.gov/bill/119th-congress/senate-bill/3208"],["[119th] H.R. 3452","Six Assurances to Taiwan Act","Direct statutory text pending CRS summary publication.","Referred to the Committee on Foreign Affairs, and in addition to the Committee on Rules, for a period to be subsequently determined by the Speaker, in each case for consideration of such provisions as fall within the jurisdiction of the committee concerned.","2025-05-15","Rep. Krishnamoorthi, Raja [D-IL-8]","29","Rep. Meeks, Gregory W. [D-NY-5], Rep. Stanton, Greg [D-AZ-4], Rep. Kim, Young [R-CA-40], Rep. Nunn, Zachary [R-IA-3], Rep. Malliotakis, Nicole [R-NY-11], Rep. Fitzpatrick, Brian K. [R-PA-1], Rep. Bera, Ami [D-CA-6], Rep. Moulton, Seth [D-MA-6], Rep. Baumgartner, Michael [R-WA-5], Rep. Lieu, Ted [D-CA-36], Rep. Schneider, Bradley Scott [D-IL-10], Del. Moylan, James C. [R-GU-At Large], Rep. DelBene, Suzan K. [D-WA-1], Rep. Swalwell, Eric [D-CA-14], Rep. Baird, James R. [R-IN-4], Rep. Johnson, Julie [D-TX-32], Rep. Lawler, Michael [R-NY-17], Rep. Landsman, Greg [D-OH-1], Rep. Feenstra, Randy [R-IA-4], Rep. Latimer, George [D-NY-16], Rep. Randall, Emily [D-WA-6], Rep. Kean, Thomas H. [R-NJ-7], Rep. Tokuda, Jill N. [D-HI-2], Rep. Suozzi, Thomas R. [D-NY-3], Re     function normDist(d) {
      if (!d) return null;
      const s = String(d).trim();
      if (!s || s === "N/A" || s === "Senate") return null;
      if (/At Large|^0$/i.test(s)) return "At Large";
      return s.replace(/^0+/, "");
    }

    function parseMember(str) {
      if (!str || !str.trim()) return null;
      const s = str.trim();
      const role = s.startsWith("Sen.") ? "Sen." : (s.startsWith("Del.") ? "Del." : "Rep.");
      const chamber = role === "Sen." ? "Senate" : "House";
      const m = s.match(/\[([A-Z])-([A-Z]{2})(?:-([^\]]+))?\]/);
      const party = m ? m[1] : "U";
      const state = m ? m[2] : "";
      const district = normDist(m && m[3] ? m[3] : null);
      const namePart = s.replace(/^(Sen\.|Rep\.|Del\.)\s*/, "").split(/\[|\(/)[0].trim();
      const lastName = (namePart.split(",")[0] || "").trim().toLowerCase();
      const id = (chamber === "House" && district ? `house|${state}|${district}|${lastName}` : `${chamber}|${state}|${lastName}`).toLowerCase();
      return { id, raw: s, role, chamber, name: namePart, displayName: `${role} ${namePart}`, party, state, district };
    }

    function parseCosponsors(str) {
      if (!str || !str.trim()) return [];
      const parts = str.trim().split(/,\s*(?=(?:Sen\.|Rep\.|Del\.)\s)/);
      const seen = new Set();
      const out = [];
      for (const p of parts) {
        const m = parseMember(p);
        if (m && !seen.has(m.id)) {
          seen.add(m.id);
          out.push(m);
        }
      }
      return out;
    }

    function classifyStage(a) {
      const s = String(a || "");
      if (/Became Public Law/i.test(s)) return { key: "enacted", label: "Enacted (Public Law)", step: 4 };
      if (/Received in the Senate|Received in the House|Held at the desk|Passed Senate|Passed House/i.test(s)) return { key: "passed_chamber", label: "Passed 1st Chamber / Desk", step: 3 };
      if (/Placed on Senate Legislative Calendar|Ordered to be Reported|Calendar No\./i.test(s)) return { key: "calendar", label: "Committee Reported / Calendar", step: 2 };
      return { key: "committee", label: "In Committee", step: 1 };
    }

    function classifyTheme(title, summary) {
      const t = `${title} ${summary}`.toLowerCase();
      if (/space|undersea|cyber|innovation|uncrewed|energy|lng|nuclear/.test(t)) return "Energy, Space & Tech Resilience";
      if (/tax|internal revenue|imf|monetary|financial|conflict deterrence|regulatory|treasury|embargo/.test(t)) return "Economic, Tax & Financial Deterrence";
      if (/porcupine|defense|ndaa|armed services|arms export|munitions|deter prc|sos act|plus act/.test(t)) return "Defense & Military Deterrence";
      if (/2758|representative office|allies fund|solidarity|holy see|vatican|americas|blue skies|travel and tourism|flag|assurance|six assurances|reinforcement/.test(t)) return "Diplomatic & International Space";
      return "Democracy & Bilateral Relations";
    }

    function buildFullDataset(rows, trackerRows) {
      const rawBills = rows.slice(1).filter(r => r && r[0] && String(r[0]).trim());
      const bills = rawBills.map((r, idx) => {
        const billNumber = String(r[0] || "").trim();
        const shortNumber = billNumber.replace(/^\[119th\]\s*/i, "").trim();
        const title = String(r[1] || "").trim();
        const summary = String(r[2] || "").trim();
        const latestAction = String(r[3] || "").trim();
        const latestActionDate = String(r[4] || "").trim();
        const sponsor = parseMember(String(r[5] || ""));
        const cosponsorCount = parseInt(r[6] || "0", 10) || 0;
        const cosponsors = parseCosponsors(String(r[7] || ""));
        const dateIntroduced = String(r[8] || "").trim();
        const daysPending = parseInt(r[9] || "0", 10) || 0;
        let link = String(r[10] || "").trim();
        const chamber = shortNumber.startsWith("S.") ? "Senate" : "House";
        const numDigits = (shortNumber.match(/\d+/) || [])[0];
        if (numDigits) {
          if (shortNumber.startsWith("S.Res.") && link.includes("/senate-bill/")) link = `https://www.congress.gov/bill/119th-congress/senate-resolution/${numDigits}`;
          if (shortNumber.startsWith("H.Res.") && link.includes("/senate-bill/")) link = `https://www.congress.gov/bill/119th-congress/house-resolution/${numDigits}`;
          if (shortNumber.startsWith("H.Con.Res.") && link.includes("/senate-bill/")) link = `https://www.congress.gov/bill/119th-congress/house-concurrent-resolution/${numDigits}`;
        }
        const rCosponsors = cosponsors.filter(c => c.party === "R").length;
        const dCosponsors = cosponsors.filter(c => c.party === "D").length;
        const totalR = rCosponsors + (sponsor && sponsor.party === "R" ? 1 : 0);
        const totalD = dCosponsors + (sponsor && sponsor.party === "D" ? 1 : 0);
        return {
          id: shortNumber, rowNumber: idx + 2, billNumber, shortNumber, chamber, title,
          cleanTitle: title.replace(/\s*\((?:House|Senate)\s+Companion\)\s*$/i, "").trim(),
          summary, latestAction, latestActionDate, sponsor, cosponsorCount, cosponsors,
          totalR, totalD, bipartisan: totalR > 0 && totalD > 0, dateIntroduced, daysPending, link,
          stage: classifyStage(latestAction), theme: classifyTheme(title, summary), companionBill: null
        };
      });

      const byShort = {};
      bills.forEach(b => { byShort[b.shortNumber.toUpperCase()] = b; });
      bills.forEach(b => {
        const m = b.summary.match(/companion to ((?:S\.|H\.R\.|S\.Res\.|H\.Res\.)\s*\d+)/i);
        if (m) {
          const key = m[1].replace(/\s+/g, " ").trim().toUpperCase();
          if (byShort[key]) { b.companionBill = byShort[key].shortNumber; byShort[key].companionBill = b.shortNumber; }
        }
      });
      [["H.R. 33","S. 199"],["S.Res. 86","H.Res. 148"],["S. 821","H.R. 1512"],["H.R. 5626","S. 3979"],["H.Res. 1278","S.Res. 754"],["H.Res. 1366","S.Res. 657"]].forEach(([a, c]) => {
        const ba = byShort[a.toUpperCase()], bc = byShort[c.toUpperCase()];
        if (ba && bc) { ba.companionBill = ba.companionBill || bc.shortNumber; bc.companionBill = bc.companionBill || ba.shortNumber; }
      });
      bills.forEach(b => {
        if (b.companionBill) return;
        const match = bills.find(o => o.shortNumber !== b.shortNumber && o.chamber !== b.chamber && o.cleanTitle.toLowerCase() === b.cleanTitle.toLowerCase());
        if (match) { b.companionBill = match.shortNumber; match.companionBill = match.companionBill || b.shortNumber; }
      });

      const legMap = {};
      trackerRows.forEach(tr => {
        const fullName = tr[0];
        const chamber = tr[1] === "S" ? "Senate" : "House";
        const party = tr[2];
        const state = tr[3];
        const district = normDist(tr[4]);
        const caucusStatus = tr[5] || "No";
        const grade = tr[6] || "";
        const role = chamber === "Senate" ? "Sen." : (["GU","AS","DC","VI","MP","PR"].includes(state) ? "Del." : "Rep.");
        const lastGuess = (fullName.split(/\s+/).pop() || "").toLowerCase();
        const id = (chamber === "House" && district ? `house|${state}|${district}|${lastGuess}` : `${chamber}|${state}|${lastGuess}`).toLowerCase();
        legMap[id] = {
          id, name: fullName, displayName: `${role} ${fullName}`, role, chamber, party, state, district,
          caucusStatus, grade, sponsoredBills: [], cosponsoredBills: []
        };
      });

      function findOrCreateLeg(member) {
        if (!member) return null;
        if (legMap[member.id]) return legMap[member.id];
        const lastPart = (member.name.split(",")[0] || "").trim().toLowerCase();
        const firstPart = ((member.name.split(",")[1] || "").trim().split(/\s+/)[0] || "").toLowerCase();
        const all = Object.values(legMap);
        let found = all.find(l => l.state === member.state && l.chamber === member.chamber && l.name.toLowerCase().includes(lastPart));
        if (found) return found;
        if (member.chamber === "House" && member.district) {
          found = all.find(l => l.state === member.state && l.chamber === "House" && l.district === member.district && (l.name.toLowerCase().includes(lastPart) || (firstPart && l.name.toLowerCase().includes(firstPart))));
          if (found) return found;
        }
        if (lastPart === "curtis" && member.state === "UT") {
          found = all.find(l => l.state === "UT" && l.name.toLowerCase().includes("curtis"));
          if (found) return found;
        }
        const cleanFull = member.name.includes(",") ? member.name.split(",").reverse().map(s => s.trim()).join(" ") : member.name;
        legMap[member.id] = {
          id: member.id, name: cleanFull, displayName: `${member.role} ${cleanFull}`, role: member.role,
          chamber: member.chamber, party: member.party, state: member.state, district: member.district,
          caucusStatus: "Former / 119th", grade: "N/A", sponsoredBills: [], cosponsoredBills: []
        };
        return legMap[member.id];
      }

      bills.forEach(b => {
        if (b.sponsor) {
          const leg = findOrCreateLeg(b.sponsor);
          if (leg) {
            b.sponsor.id = leg.id; b.sponsor.displayName = leg.displayName;
            if (!leg.sponsoredBills.includes(b.shortNumber)) leg.sponsoredBills.push(b.shortNumber);
          }
        }
        b.cosponsors.forEach(c => {
          const leg = findOrCreateLeg(c);
          if (leg) {
            c.id = leg.id; c.displayName = leg.displayName;
            if (!leg.sponsoredBills.includes(b.shortNumber) && !leg.cosponsoredBills.includes(b.shortNumber)) leg.cosponsoredBills.push(b.shortNumber);
          }
        });
      });

      const legislators = Object.values(legMap).map(l => ({
        ...l,
        sponsoredCount: l.sponsoredBills.length,
        cosponsoredCount: l.cosponsoredBills.length,
        totalInvolvement: l.sponsoredBills.length + l.cosponsoredBills.length
      })).sort((a, b) => b.totalInvolvement - a.totalInvolvement || b.sponsoredCount - a.sponsoredCount || a.state.localeCompare(b.state) || a.name.localeCompare(b.name));

      return {
        spreadsheetId: "1fxEmsfhBS5tEw65fGWxi2-iz7O41Vj8AsNjC4SU1OAM",
        spreadsheetUrl: "https://docs.google.com/spreadsheets/d/1fxEmsfhBS5tEw65fGWxi2-iz7O41Vj8AsNjC4SU1OAM/edit",
        totalBills: bills.length,
        enactedCount: bills.filter(b => b.stage.key === "enacted").length,
        bipartisanCount: bills.filter(b => b.bipartisan).length,
        companionPairsCount: Math.floor(bills.filter(b => b.companionBill).length / 2),
        totalLegislators: legislators.length,
        activeLegislatorsCount: legislators.filter(l => l.totalInvolvement > 0).length,
        bills,
        legislators
      };
    }

    window.TAIWAN_BILLS_DATA = buildFullDataset(RAW_ROWS, TRACKER_COMPACT);
  }

</head>

  <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6"></div>

  <!-- Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div id="modal-content" class="bg-slate-900 border border-slate-700 rounded-xl max-w-3xl w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden"></div>
  </div>

  <script>
    const state = {
      data: window.TAIWAN_BILLS_DATA || null,
      activeTab: 'explorer', // 'explorer' | 'companions' | 'legislators' | 'dashboard'
      search: '',
      chamberFilter: 'ALL',
      stageFilter: 'ALL',
      themeFilter: 'ALL',
      supportFilter: 'ALL', // 'ALL' | 'BIPARTISAN' | 'COMPANION'
      sortBy: 'cosponsors_desc', // 'cosponsors_desc' | 'action_desc' | 'intro_desc' | 'pending_desc' | 'sheet_order'
      legSearch: '',
      legStateFilter: 'ALL',
      legChamberFilter: 'ALL',
      legPartyFilter: 'ALL',
      legCaucusFilter: 'ALL',
      legActivityFilter: 'ALL',
      syncing: false,
      syncStatusMsg: ''
    };

    const STAGE_BADGES = {
      enacted: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
      passed_chamber: 'bg-sky-500/15 text-sky-300 border-sky-500/30',
      calendar: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
      committee: 'bg-slate-700/50 text-slate-300 border-slate-600/50'
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function partyBadge(party, stateCode, district) {
      const loc = district ? `${stateCode}-${district}` : stateCode;
      if (party === 'R') {
        return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-red-500/15 text-red-300 border border-red-500/30">R-${escapeHtml(loc)}</span>`;
      } else if (party === 'D') {
        return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-blue-500/15 text-blue-300 border border-blue-500/30">D-${escapeHtml(loc)}</span>`;
      }
      return `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-medium bg-slate-700 text-slate-300">${escapeHtml(party)}-${escapeHtml(loc)}</span>`;
    }

    async function syncFromGoogleSheet() {
      if (state.syncing) return;
      state.syncing = true;
      state.syncStatusMsg = 'Syncing live rows from Google Sheet...';
      render();
      try {
        const res = await fetch('/api/sync', { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const fresh = await res.json();
        state.data = fresh;
        state.syncStatusMsg = `Synced ${fresh.totalBills} bills from Google Sheet (${fresh.lastSyncedAt})`;
      } catch (err) {
        state.syncStatusMsg = 'Using local snapshot (run server.rb for live CLI sync)';
      } finally {
        state.syncing = false;
        render();
      }
    }

    function getFilteredBills() {
      if (!state.data) return [];
      const q = state.search.trim().toLowerCase();
      let list = state.data.bills.filter(b => {
        if (state.chamberFilter !== 'ALL' && b.chamber !== state.chamberFilter) return false;
        if (state.stageFilter !== 'ALL' && b.stage.key !== state.stageFilter) return false;
        if (state.themeFilter !== 'ALL' && b.theme !== state.themeFilter) return false;
        if (state.supportFilter === 'BIPARTISAN' && !b.bipartisan) return false;
        if (state.supportFilter === 'COMPANION' && !b.companionBill) return false;
        if (q) {
          const hay = [
            b.billNumber,
            b.shortNumber,
            b.title,
            b.summary,
            b.latestAction,
            b.theme,
            b.sponsor ? b.sponsor.raw : '',
            b.cosponsors.map(c => c.raw).join(' ')
          ].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (state.sortBy === 'cosponsors_desc') return b.cosponsorCount - a.cosponsorCount || a.rowNumber - b.rowNumber;
        if (state.sortBy === 'action_desc') return (b.latestActionDate || '').localeCompare(a.latestActionDate || '');
        if (state.sortBy === 'intro_desc') return (b.dateIntroduced || '').localeCompare(a.dateIntroduced || '');
        if (state.sortBy === 'pending_desc') return b.daysPending - a.daysPending;
        if (state.sortBy === 'stage_desc') return b.stage.step - a.stage.step || b.cosponsorCount - a.cosponsorCount;
        return a.rowNumber - b.rowNumber;
      });
      return list;
    }

    function getFilteredLegislators() {
      if (!state.data) return [];
      const q = state.legSearch.trim().toLowerCase();
      return state.data.legislators.filter(l => {
        if (state.legChamberFilter !== 'ALL' && l.chamber !== state.legChamberFilter) return false;
        if (state.legPartyFilter !== 'ALL' && l.party !== state.legPartyFilter) return false;
        if (state.legStateFilter !== 'ALL' && l.state !== state.legStateFilter) return false;
        if (q) {
          const hay = `${l.displayName} ${l.state} ${l.party}-${l.state} ${l.sponsoredBills.join(' ')} ${l.cosponsoredBills.join(' ')}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function openBillModal(shortNum) {
      const bill = state.data.bills.find(b => b.shortNumber === shortNum);
      if (!bill) return;
      const companion = bill.companionBill ? state.data.bills.find(b => b.shortNumber === bill.companionBill) : null;
      const modal = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');

      const steps = [
        { step: 1, label: 'Introduced & In Committee' },
        { step: 2, label: 'Committee Reported / Calendar' },
        { step: 3, label: 'Passed 1st Chamber / Desk' },
        { step: 4, label: 'Enacted (Public Law)' }
      ];

      const totalSupporters = bill.totalR + bill.totalD;
      const rPct = totalSupporters ? Math.round((bill.totalR / totalSupporters) * 100) : 0;
      const dPct = totalSupporters ? 100 - rPct : 0;

      content.innerHTML = `
        <div class="px-6 py-4 bg-slate-800/80 border-b border-slate-700 flex items-start justify-between gap-4">
          <div>
            <div class="flex flex-wrap items-center gap-2 mb-1.5">
              <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-blue-600 text-white">${escapeHtml(bill.billNumber)}</span>
              <span class="px-2 py-0.5 rounded text-xs font-medium border ${STAGE_BADGES[bill.stage.key]}">${escapeHtml(bill.stage.label)}</span>
              <span class="px-2 py-0.5 rounded text-xs bg-slate-700/80 text-slate-300">${escapeHtml(bill.theme)}</span>
              ${bill.bipartisan ? `<span class="px-2 py-0.5 rounded text-xs bg-purple-500/15 text-purple-300 border border-purple-500/30">Bipartisan (${bill.totalR}R / ${bill.totalD}D)</span>` : ''}
            </div>
            <h2 class="text-lg font-bold text-white leading-snug">${escapeHtml(bill.title)}</h2>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700/60 transition">✕</button>
        </div>

        <div class="p-6 overflow-y-auto custom-scroll space-y-5 text-sm">
          <!-- Legislative Progress Stepper -->
          <div class="bg-slate-800/50 border border-slate-700/70 rounded-lg p-4">
            <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3">Legislative Progress Pipeline</div>
            <div class="grid grid-cols-4 gap-2">
              ${steps.map(s => {
                const active = bill.stage.step >= s.step;
                const current = bill.stage.step === s.step;
                return `
                  <div class="flex flex-col">
                    <div class="h-2 rounded-full mb-2 ${active ? (bill.stage.step === 4 ? 'bg-emerald-500' : 'bg-blue-500') : 'bg-slate-700'}"></div>
                    <span class="text-xs ${current ? 'text-white font-semibold' : (active ? 'text-slate-300' : 'text-slate-500')}">${s.step}. ${escapeHtml(s.label)}</span>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="mt-3 pt-3 border-t border-slate-700/60 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-300">
              <div><span class="text-slate-400">Latest Action (${escapeHtml(bill.latestActionDate)}):</span> ${escapeHtml(bill.latestAction)}</div>
              <div class="font-mono text-slate-400">Introduced: ${escapeHtml(bill.dateIntroduced)} · ${bill.daysPending} days pending</div>
            </div>
          </div>

          <!-- Summary -->
          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Summary & Policy Impact</h3>
            <p class="text-slate-200 leading-relaxed bg-slate-800/30 border border-slate-800 rounded-lg p-3.5">${escapeHtml(bill.summary)}</p>
          </div>

          <!-- Companion Bill -->
          ${companion ? `
            <div class="bg-indigo-950/30 border border-indigo-500/30 rounded-lg p-3.5 flex items-center justify-between gap-4">
              <div>
                <div class="text-xs font-semibold text-indigo-300 uppercase tracking-wider">Bicameral Companion Bill (${escapeHtml(companion.chamber)})</div>
                <div class="text-sm font-semibold text-white mt-0.5">${escapeHtml(companion.billNumber)} — ${escapeHtml(companion.title)}</div>
                <div class="text-xs text-slate-400 mt-0.5">Sponsor: ${escapeHtml(companion.sponsor ? companion.sponsor.displayName : '')} · ${companion.cosponsorCount} cosponsors · Stage: ${escapeHtml(companion.stage.label)}</div>
              </div>
              <button onclick="openBillModal('${escapeHtml(companion.shortNumber)}')" class="shrink-0 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium transition">
                Inspect ${escapeHtml(companion.shortNumber)} →
              </button>
            </div>
          ` : ''}

          <!-- Sponsor & Bipartisan Breakdown -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-slate-800/40 border border-slate-700/60 rounded-lg p-3.5">
              <div class="text-xs text-slate-400 uppercase font-semibold mb-1.5">Primary Sponsor</div>
              ${bill.sponsor ? `
                <div class="flex items-center justify-between">
                  <button onclick="openLegislatorModal('${escapeHtml(bill.sponsor.id)}')" class="text-left font-semibold text-white hover:text-blue-400 transition">
                    ${escapeHtml(bill.sponsor.displayName)}
                  </button>
                  ${partyBadge(bill.sponsor.party, bill.sponsor.state, bill.sponsor.district)}
                </div>
              ` : '<span class="text-slate-500">N/A</span>'}
            </div>

            <div class="bg-slate-800/40 border border-slate-700/60 rounded-lg p-3.5">
              <div class="flex items-center justify-between text-xs mb-1.5">
                <span class="text-slate-400 uppercase font-semibold">Party Breakdown (Sponsor + ${bill.cosponsorCount} Cosponsors)</span>
                <span class="font-mono text-slate-300">${bill.totalR}R · ${bill.totalD}D</span>
              </div>
              <div class="w-full h-2.5 bg-slate-700 rounded-full overflow-hidden flex">
                <div style="width:${rPct}%" class="bg-red-500 h-full" title="Republican: ${bill.totalR}"></div>
                <div style="width:${dPct}%" class="bg-blue-500 h-full" title="Democratic: ${bill.totalD}"></div>
              </div>
              <div class="flex justify-between text-[11px] text-slate-400 mt-1">
                <span>Republican: ${bill.totalR} (${rPct}%)</span>
                <span>Democratic: ${bill.totalD} (${dPct}%)</span>
              </div>
            </div>
          </div>

          <!-- Cosponsors List -->
          <div>
            <div class="flex items-center justify-between mb-2">
              <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cosponsors (${bill.cosponsors.length})</h3>
            </div>
            ${bill.cosponsors.length === 0 ? `
              <div class="text-xs text-slate-500 italic py-3">No cosponsors recorded yet in Google Sheet.</div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 max-h-60 overflow-y-auto custom-scroll pr-1">
                ${bill.cosponsors.map(c => `
                  <button onclick="openLegislatorModal('${escapeHtml(c.id)}')" class="flex items-center justify-between gap-2 p-2 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700/50 text-left transition">
                    <span class="text-xs text-slate-200 truncate">${escapeHtml(c.displayName)}</span>
                    ${partyBadge(c.party, c.state, c.district)}
                  </button>
                `).join('')}
              </div>
            `}
          </div>
        </div>

        <div class="px-6 py-3.5 bg-slate-800/90 border-t border-slate-700 flex flex-wrap items-center justify-between gap-3 text-xs">
          <span class="text-slate-400">Google Sheet Row #${bill.rowNumber} · Formula Days Pending: ${bill.daysPending}d</span>
          <div class="flex items-center gap-2.5">
            <a href="${escapeHtml(state.data.spreadsheetUrl)}#gid=0&range=A${bill.rowNumber}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition">
              Open Row in Google Sheet ↗
            </a>
            <a href="${escapeHtml(bill.link)}" target="_blank" rel="noopener" class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium transition">
              View on Congress.gov ↗
            </a>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function openLegislatorModal(legId) {
      const leg = state.data.legislators.find(l => l.id === legId);
      if (!leg) return;
      const modal = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');

      const sponsored = leg.sponsoredBills.map(sn => state.data.bills.find(b => b.shortNumber === sn)).filter(Boolean);
      const cosponsored = leg.cosponsoredBills.map(sn => state.data.bills.find(b => b.shortNumber === sn)).filter(Boolean);
      const opportunities = state.data.bills.filter(b =>
        b.chamber === leg.chamber &&
        !leg.sponsoredBills.includes(b.shortNumber) &&
        !leg.cosponsoredBills.includes(b.shortNumber)
      ).sort((a, b) => b.cosponsorCount - a.cosponsorCount).slice(0, 8);

      content.innerHTML = `
        <div class="px-6 py-4 bg-slate-800/80 border-b border-slate-700 flex items-start justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              ${partyBadge(leg.party, leg.state, leg.district)}
              <span class="px-2 py-0.5 rounded text-xs bg-slate-700 text-slate-300">${escapeHtml(leg.chamber)}</span>
            </div>
            <h2 class="text-lg font-bold text-white">${escapeHtml(leg.displayName)}</h2>
            <p class="text-xs text-slate-400 mt-0.5">Total Taiwan Legislation Involvement: <strong class="text-white">${leg.totalInvolvement} bills</strong> (${leg.sponsoredCount} Sponsored · ${leg.cosponsoredCount} Cosponsored)</p>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-700/60 transition">✕</button>
        </div>

        <div class="p-6 overflow-y-auto custom-scroll space-y-5 text-sm">
          ${sponsored.length > 0 ? `
            <div>
              <h3 class="text-xs font-semibold uppercase tracking-wider text-emerald-400 mb-2">Sponsored Taiwan Bills (${sponsored.length})</h3>
              <div class="space-y-2">
                ${sponsored.map(b => `
                  <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer p-3 rounded-lg bg-slate-800/60 hover:bg-slate-800 border border-slate-700 flex items-center justify-between gap-3 transition">
                    <div>
                      <div class="font-semibold text-white text-xs">${escapeHtml(b.billNumber)} — ${escapeHtml(b.title)}</div>
                      <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(b.stage.label)} · ${b.cosponsorCount} cosponsors</div>
                    </div>
                    <span class="text-xs text-blue-400 shrink-0">View →</span>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div>
            <h3 class="text-xs font-semibold uppercase tracking-wider text-blue-400 mb-2">Cosponsored Taiwan Bills (${cosponsored.length})</h3>
            ${cosponsored.length === 0 ? `<div class="text-xs text-slate-500 italic">None cosponsored yet.</div>` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${cosponsored.map(b => `
                  <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer p-2.5 rounded-lg bg-slate-800/40 hover:bg-slate-800 border border-slate-700/60 transition">
                    <div class="flex items-center justify-between gap-2">
                      <span class="font-bold text-xs text-white">${escapeHtml(b.shortNumber)}</span>
                      <span class="text-[11px] text-slate-400">${escapeHtml(b.stage.label)}</span>
                    </div>
                    <div class="text-xs text-slate-300 truncate mt-0.5">${escapeHtml(b.cleanTitle)}</div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- Constituent Advocacy Opportunities -->
          <div class="bg-amber-500/5 border border-amber-500/20 rounded-lg p-4">
            <div class="text-xs font-semibold uppercase tracking-wider text-amber-300 mb-1">Advocacy Ask: Top ${escapeHtml(leg.chamber)} Bills Not Yet Cosponsored</div>
            <p class="text-xs text-slate-400 mb-3">Use this list when meeting with ${escapeHtml(leg.displayName)}'s office to request additional cosponsorships:</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${opportunities.map(b => `
                <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer p-2.5 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-700/70 transition">
                  <div class="flex items-center justify-between">
                    <span class="font-semibold text-xs text-amber-300">${escapeHtml(b.shortNumber)}</span>
                    <span class="text-[11px] text-slate-400">${b.cosponsorCount} cosponsors</span>
                  </div>
                  <div class="text-xs text-slate-200 truncate mt-0.5">${escapeHtml(b.cleanTitle)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function exportFilteredCsv() {
      const bills = getFilteredBills();
      const headers = ['Bill Number', 'Title', 'Chamber', 'Stage', 'Theme', 'Sponsor', 'Cosponsor Count', 'Republican Support', 'Democratic Support', 'Date Introduced', 'Days Pending', 'Latest Action Date', 'Latest Action', 'Congress.gov Link'];
      const rows = bills.map(b => [
        b.billNumber,
        b.title,
        b.chamber,
        b.stage.label,
        b.theme,
        b.sponsor ? b.sponsor.raw : '',
        b.cosponsorCount,
        b.totalR,
        b.totalD,
        b.dateIntroduced,
        b.daysPending,
        b.latestActionDate,
        b.latestAction,
        b.link
      ]);
      const csv = [headers, ...rows].map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'congress_taiwan_bills_filtered.csv';
      a.click();
    }

    function renderExplorerTab() {
      const bills = getFilteredBills();
      const themes = ['ALL', ...new Set(state.data.bills.map(b => b.theme))];

      return `
        <div class="space-y-4">
          <!-- Filter & Search Bar -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
              <div class="md:col-span-5 relative">
                <input
                  id="bill-search-input"
                  type="text"
                  value="${escapeHtml(state.search)}"
                  oninput="state.search = this.value; renderBodyOnly();"
                  placeholder="Search bills, titles, sponsors, cosponsors (e.g. PORCUPINE, Ricketts, Lawler)..."
                  class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
                />
              </div>
              <div class="md:col-span-2">
                <select onchange="state.chamberFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                  <option value="ALL" ${state.chamberFilter === 'ALL' ? 'selected' : ''}>All Chambers</option>
                  <option value="Senate" ${state.chamberFilter === 'Senate' ? 'selected' : ''}>Senate (S. / S.Res.)</option>
                  <option value="House" ${state.chamberFilter === 'House' ? 'selected' : ''}>House (H.R. / H.Res.)</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <select onchange="state.stageFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                  <option value="ALL" ${state.stageFilter === 'ALL' ? 'selected' : ''}>All Stages</option>
                  <option value="enacted" ${state.stageFilter === 'enacted' ? 'selected' : ''}>Enacted (Public Law)</option>
                  <option value="passed_chamber" ${state.stageFilter === 'passed_chamber' ? 'selected' : ''}>Passed 1st Chamber / Desk</option>
                  <option value="calendar" ${state.stageFilter === 'calendar' ? 'selected' : ''}>Calendar / Reported</option>
                  <option value="committee" ${state.stageFilter === 'committee' ? 'selected' : ''}>In Committee</option>
                </select>
              </div>
              <div class="md:col-span-3">
                <select onchange="state.sortBy = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                  <option value="cosponsors_desc" ${state.sortBy === 'cosponsors_desc' ? 'selected' : ''}>Sort: Most Cosponsors</option>
                  <option value="stage_desc" ${state.sortBy === 'stage_desc' ? 'selected' : ''}>Sort: Furthest Legislative Stage</option>
                  <option value="action_desc" ${state.sortBy === 'action_desc' ? 'selected' : ''}>Sort: Latest Action Date</option>
                  <option value="intro_desc" ${state.sortBy === 'intro_desc' ? 'selected' : ''}>Sort: Recently Introduced</option>
                  <option value="pending_desc" ${state.sortBy === 'pending_desc' ? 'selected' : ''}>Sort: Days Pending</option>
                  <option value="sheet_order" ${state.sortBy === 'sheet_order' ? 'selected' : ''}>Sort: Google Sheet Row Order</option>
                </select>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-1 border-t border-slate-800/80 text-xs">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-slate-400 mr-1">Theme:</span>
                ${themes.map(t => `
                  <button
                    onclick="state.themeFilter = '${escapeHtml(t)}'; render();"
                    class="px-2.5 py-1 rounded-full transition ${state.themeFilter === t ? 'bg-blue-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}"
                  >${t === 'ALL' ? 'All Themes' : escapeHtml(t)}</button>
                `).join('')}
              </div>
              <div class="flex items-center gap-2">
                <button
                  onclick="state.supportFilter = state.supportFilter === 'BIPARTISAN' ? 'ALL' : 'BIPARTISAN'; render();"
                  class="px-2.5 py-1 rounded-full border transition ${state.supportFilter === 'BIPARTISAN' ? 'bg-purple-600/30 border-purple-400 text-purple-200' : 'border-slate-700 text-slate-400 hover:text-slate-200'}"
                >Bipartisan Only</button>
                <button
                  onclick="state.supportFilter = state.supportFilter === 'COMPANION' ? 'ALL' : 'COMPANION'; render();"
                  class="px-2.5 py-1 rounded-full border transition ${state.supportFilter === 'COMPANION' ? 'bg-indigo-600/30 border-indigo-400 text-indigo-200' : 'border-slate-700 text-slate-400 hover:text-slate-200'}"
                >Has Companion Bill</button>
                <span class="text-slate-400 font-mono ml-1">${bills.length} / ${state.data.totalBills} bills</span>
              </div>
            </div>
          </div>

          <!-- Bills Grid -->
          <div id="bills-results-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${renderBillCards(bills)}
          </div>
        </div>
      `;
    }

    function renderBillCards(bills) {
      if (bills.length === 0) {
        return `<div class="col-span-2 text-center py-12 bg-slate-900/50 border border-slate-800 rounded-xl text-slate-400">No bills match your current filters.</div>`;
      }
      return bills.map(b => {
        const tot = b.totalR + b.totalD;
        const rPct = tot ? Math.round((b.totalR / tot) * 100) : 0;
        const dPct = tot ? 100 - rPct : 0;
        return `
          <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer group bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-slate-600 rounded-xl p-4 flex flex-col justify-between transition shadow-sm">
            <div>
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-0.5 rounded-md text-xs font-bold ${b.chamber === 'Senate' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'}">${escapeHtml(b.shortNumber)}</span>
                  <span class="px-2 py-0.5 rounded text-[11px] font-medium border ${STAGE_BADGES[b.stage.key]}">${escapeHtml(b.stage.label)}</span>
                </div>
                <div class="flex items-center gap-1.5">
                  ${b.companionBill ? `<span onclick="event.stopPropagation(); openBillModal('${escapeHtml(b.companionBill)}')" class="px-2 py-0.5 rounded text-[11px] bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 hover:bg-indigo-500/30" title="Click to view companion bill">⇄ ${escapeHtml(b.companionBill)}</span>` : ''}
                  <span class="text-[11px] font-mono text-slate-400">${b.daysPending}d pending</span>
                </div>
              </div>

              <h3 class="text-base font-bold text-white group-hover:text-blue-400 transition line-clamp-2 mb-1.5">${escapeHtml(b.title)}</h3>
              <p class="text-xs text-slate-400 line-clamp-2 mb-3 leading-relaxed">${escapeHtml(b.summary)}</p>
            </div>

            <div class="space-y-2.5 pt-2.5 border-t border-slate-800/90">
              <div class="flex items-center justify-between text-xs">
                <div class="flex items-center gap-1.5 truncate">
                  <span class="text-slate-500">Sponsor:</span>
                  <span class="text-slate-200 font-medium truncate">${escapeHtml(b.sponsor ? b.sponsor.displayName : 'N/A')}</span>
                  ${b.sponsor ? partyBadge(b.sponsor.party, b.sponsor.state, b.sponsor.district) : ''}
                </div>
                <span class="text-[11px] text-slate-400 shrink-0">${escapeHtml(b.theme.split('&')[0].trim())}</span>
              </div>

              <!-- Cosponsor Bipartisan Bar -->
              <div>
                <div class="flex items-center justify-between text-[11px] mb-1">
                  <span class="text-slate-300 font-medium">${b.cosponsorCount} Cosponsors ${b.bipartisan ? '<span class="text-purple-300 ml-1">· Bipartisan</span>' : ''}</span>
                  <span class="font-mono text-slate-400">${b.totalR}R / ${b.totalD}D total</span>
                </div>
                <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden flex">
                  <div style="width:${rPct}%" class="bg-red-500 h-full"></div>
                  <div style="width:${dPct}%" class="bg-blue-500 h-full"></div>
                </div>
              </div>

              <div class="flex items-center justify-between text-[11px] text-slate-400 pt-0.5">
                <span class="truncate max-w-[75%]"><strong class="text-slate-300">${escapeHtml(b.latestActionDate)}:</strong> ${escapeHtml(b.latestAction)}</span>
                <span class="text-blue-400 font-medium shrink-0">Details →</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCompanionsTab() {
      const seen = new Set();
      const pairs = [];
      state.data.bills.forEach(b => {
        if (b.companionBill && !seen.has(b.shortNumber) && !seen.has(b.companionBill)) {
          const other = state.data.bills.find(x => x.shortNumber === b.companionBill);
          if (other) {
            seen.add(b.shortNumber);
            seen.add(other.shortNumber);
            const senateBill = b.chamber === 'Senate' ? b : other;
            const houseBill = b.chamber === 'House' ? b : other;
            pairs.push({ senate: senateBill, house: houseBill });
          }
        }
      });

      return `
        <div class="space-y-4">
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-base font-bold text-white">Bicameral Companion Bill Pairs (${pairs.length} Pairs · ${pairs.length * 2} Bills)</h2>
              <p class="text-xs text-slate-400 mt-0.5">Automatically matched across Senate and House versions to track bicameral momentum Toward enactment.</p>
            </div>
          </div>

          <div class="space-y-3">
            ${pairs.map(p => `
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-800">
                  <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-indigo-400">${escapeHtml(p.senate.theme)}</span>
                    <h3 class="text-base font-bold text-white">${escapeHtml(p.senate.cleanTitle)}</h3>
                  </div>
                  <div class="text-xs font-mono bg-slate-800 px-3 py-1 rounded-full text-slate-300">
                    Combined Cosponsors: <strong class="text-white">${p.senate.cosponsorCount + p.house.cosponsorCount}</strong>
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  ${[p.senate, p.house].map(b => `
                    <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer p-3.5 rounded-lg bg-slate-950/70 hover:bg-slate-800/70 border border-slate-800 transition">
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <span class="px-2 py-0.5 rounded text-xs font-bold ${b.chamber === 'Senate' ? 'bg-amber-500/20 text-amber-300' : 'bg-blue-500/20 text-blue-300'}">${escapeHtml(b.chamber)}: ${escapeHtml(b.shortNumber)}</span>
                        <span class="px-2 py-0.5 rounded text-[11px] border ${STAGE_BADGES[b.stage.key]}">${escapeHtml(b.stage.label)}</span>
                      </div>
                      <div class="text-xs text-slate-300 mb-2">
                        Sponsor: <strong class="text-white">${escapeHtml(b.sponsor ? b.sponsor.displayName : '')}</strong>
                        ${b.sponsor ? partyBadge(b.sponsor.party, b.sponsor.state, b.sponsor.district) : ''}
                      </div>
                      <div class="flex items-center justify-between text-[11px] text-slate-400">
                        <span>Cosponsors: <strong class="text-slate-200">${b.cosponsorCount}</strong> (${b.totalR}R / ${b.totalD}D)</span>
                        <span>Latest: ${escapeHtml(b.latestActionDate)}</span>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderLegislatorsTab() {
  const legs = getFilteredLegislators();
  const states = ['ALL', ...new Set(state.data.legislators.map(l => l.state).filter(Boolean).sort())];
  const activeCount = state.data.legislators.filter(l => l.totalInvolvement > 0).length;
  const zeroCount = state.data.legislators.length - activeCount;

  return `
    <div class="space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-base font-bold text-white">Full Congressional Roster & Constituent Lookup (${state.data.totalLegislators} Lawmakers)</h2>
            <p class="text-xs text-slate-400">Includes all 100 Senators, 435 Representatives, and Delegates (${activeCount} with 1+ Taiwan bills · ${zeroCount} with 0 bills so far). Click any lawmaker for their full profile and advocacy asks.</p>
          </div>
          <span class="text-xs font-mono text-slate-300 bg-slate-950 border border-slate-800 px-3 py-1 rounded-full">Showing ${legs.length} of ${state.data.totalLegislators} lawmakers</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 pt-1">
          <div class="sm:col-span-4">
            <input
              type="text"
              value="${escapeHtml(state.legSearch)}"
              oninput="state.legSearch = this.value; renderLegislatorTableOnly();"
              placeholder="Search by lawmaker name, state (e.g. WA, CA, TX), or bill..."
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500"
            />
          </div>
          <div class="sm:col-span-2">
            <select onchange="state.legStateFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
              ${states.map(st => `<option value="${st}" ${state.legStateFilter === st ? 'selected' : ''}>${st === 'ALL' ? 'All States' : 'State: ' + st}</option>`).join('')}
            </select>
          </div>
          <div class="sm:col-span-2">
            <select onchange="state.legChamberFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
              <option value="ALL" ${state.legChamberFilter === 'ALL' ? 'selected' : ''}>Both Chambers</option>
              <option value="Senate" ${state.legChamberFilter === 'Senate' ? 'selected' : ''}>Senate (100)</option>
              <option value="House" ${state.legChamberFilter === 'House' ? 'selected' : ''}>House</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <select onchange="state.legPartyFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
              <option value="ALL" ${state.legPartyFilter === 'ALL' ? 'selected' : ''}>All Parties</option>
              <option value="R" ${state.legPartyFilter === 'R' ? 'selected' : ''}>Republican (R)</option>
              <option value="D" ${state.legPartyFilter === 'D' ? 'selected' : ''}>Democratic (D)</option>
              <option value="I" ${state.legPartyFilter === 'I' ? 'selected' : ''}>Independent (I)</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <select onchange="state.legActivityFilter = this.value; render();" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
              <option value="ALL" ${state.legActivityFilter === 'ALL' ? 'selected' : ''}>All (${state.data.totalLegislators})</option>
              <option value="ACTIVE" ${state.legActivityFilter === 'ACTIVE' ? 'selected' : ''}>1+ Bills (${activeCount})</option>
              <option value="ZERO" ${state.legActivityFilter === 'ZERO' ? 'selected' : ''}>0 Bills Yet (${zeroCount})</option>
            </select>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-800/80 text-xs">
          <span class="text-slate-400">Taiwan Caucus Filter:</span>
          <button onclick="state.legCaucusFilter = 'ALL'; render();" class="px-2.5 py-1 rounded-full transition ${state.legCaucusFilter === 'ALL' ? 'bg-blue-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">All Members</button>
          <button onclick="state.legCaucusFilter = 'MEMBER'; render();" class="px-2.5 py-1 rounded-full transition ${state.legCaucusFilter === 'MEMBER' ? 'bg-emerald-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Taiwan Caucus Members & Co-Chairs</button>
          <button onclick="state.legCaucusFilter = 'NON_MEMBER'; render();" class="px-2.5 py-1 rounded-full transition ${state.legCaucusFilter === 'NON_MEMBER' ? 'bg-amber-600 text-white font-medium' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Not in Taiwan Caucus</button>
        </div>
      </div>

      <div id="legislators-table-container" class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
        ${renderLegislatorRows(legs)}
      </div>
    </div>
  `;
}

function renderLegislatorRows(legs) {
  if (legs.length === 0) {
    return `<div class="p-8 text-center text-slate-400">No legislators match your filter criteria.</div>`;
  }
  return `
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-800 text-xs uppercase text-slate-400 bg-slate-950/60">
            <th class="py-3 px-4">Rank</th>
            <th class="py-3 px-4">Lawmaker</th>
            <th class="py-3 px-4">Party / State</th>
            <th class="py-3 px-4">Chamber</th>
            <th class="py-3 px-4 text-center">Taiwan Caucus</th>
            <th class="py-3 px-4 text-center">Grade</th>
            <th class="py-3 px-4 text-center">Sponsored</th>
            <th class="py-3 px-4 text-center">Cosponsored</th>
            <th class="py-3 px-4 text-center">119th Bills</th>
            <th class="py-3 px-4">Supported Bills (119th Congress)</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-800/70">
          ${legs.map((l, idx) => `
            <tr onclick="openLegislatorModal('${escapeHtml(l.id)}')" class="cursor-pointer hover:bg-slate-800/60 transition">
              <td class="py-3 px-4 font-mono text-xs text-slate-500">#${idx + 1}</td>
              <td class="py-3 px-4 font-semibold text-white hover:text-blue-400">${escapeHtml(l.displayName)}</td>
              <td class="py-3 px-4">${partyBadge(l.party, l.state, l.district)}</td>
              <td class="py-3 px-4 text-xs text-slate-300">${escapeHtml(l.chamber)}</td>
              <td class="py-3 px-4 text-center text-xs">
                ${l.caucusStatus === 'Co-Chair' ? `<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 font-semibold">Co-Chair</span>` : (l.caucusStatus === 'Member' ? `<span class="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">Member</span>` : `<span class="text-slate-500">—</span>`)}
              </td>
              <td class="py-3 px-4 text-center font-mono text-xs">
                ${l.grade && l.grade !== 'N/A' ? `<span class="px-2 py-0.5 rounded font-bold ${l.grade === 'A' ? 'bg-emerald-500/20 text-emerald-300' : (l.grade === 'B' ? 'bg-blue-500/20 text-blue-300' : (l.grade === 'C' ? 'bg-slate-700 text-slate-300' : 'bg-red-500/15 text-red-300'))}">${escapeHtml(l.grade)}</span>` : `<span class="text-slate-500">—</span>`}
              </td>
              <td class="py-3 px-4 text-center font-mono ${l.sponsoredCount > 0 ? 'text-emerald-400 font-bold' : 'text-slate-500'}">${l.sponsoredCount}</td>
              <td class="py-3 px-4 text-center font-mono ${l.cosponsoredCount > 0 ? 'text-blue-300' : 'text-slate-500'}">${l.cosponsoredCount}</td>
              <td class="py-3 px-4 text-center">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${l.totalInvolvement > 0 ? 'bg-slate-800 text-white border border-slate-700' : 'bg-slate-900 text-slate-500 border border-slate-800'}">${l.totalInvolvement}</span>
              </td>
              <td class="py-3 px-4">
                ${l.totalInvolvement === 0 ? `<span class="text-xs text-slate-500 italic">0 bills in 119th Congress — click for advocacy asks</span>` : `
                  <div class="flex flex-wrap gap-1">
                    ${[...l.sponsoredBills, ...l.cosponsoredBills].slice(0, 5).map(bn => `
                      <span class="px-1.5 py-0.5 rounded text-[11px] ${l.sponsoredBills.includes(bn) ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-300'}">${escapeHtml(bn)}</span>
                    `).join('')}
                    ${(l.sponsoredBills.length + l.cosponsoredBills.length) > 5 ? `<span class="text-[11px] text-slate-500">+${(l.sponsoredBills.length + l.cosponsoredBills.length) - 5} more</span>` : ''}
                  </div>
                `}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

    function renderDashboardTab() {
      const bills = state.data.bills;
      const stages = [
        { key: 'committee', label: 'In Committee', color: 'bg-slate-500' },
        { key: 'calendar', label: 'Committee Reported / Senate Calendar', color: 'bg-amber-500' },
        { key: 'passed_chamber', label: 'Passed 1st Chamber / Held at Desk', color: 'bg-sky-500' },
        { key: 'enacted', label: 'Enacted (Public Law)', color: 'bg-emerald-500' }
      ];

      const themeCounts = {};
      bills.forEach(b => { themeCounts[b.theme] = (themeCounts[b.theme] || 0) + 1; });
      const topBills = [...bills].sort((a, b) => b.cosponsorCount - a.cosponsorCount).slice(0, 8);

      const stateCounts = {};
      state.data.legislators.forEach(l => {
        if (l.state) stateCounts[l.state] = (stateCounts[l.state] || 0) + l.totalInvolvement;
      });
      const topStates = Object.entries(stateCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <!-- Legislative Pipeline Funnel -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-1">Legislative Pipeline Progression</h3>
            <p class="text-xs text-slate-400 mb-4">Click any stage to filter bills in the Explorer.</p>
            <div class="space-y-3.5">
              ${stages.map(s => {
                const matched = bills.filter(b => b.stage.key === s.key);
                const pct = Math.round((matched.length / bills.length) * 100);
                return `
                  <div onclick="state.stageFilter = '${s.key}'; state.activeTab = 'explorer'; render();" class="cursor-pointer group">
                    <div class="flex justify-between text-xs mb-1">
                      <span class="font-semibold text-slate-200 group-hover:text-blue-400 transition">${escapeHtml(s.label)}</span>
                      <span class="font-mono text-slate-400">${matched.length} bills (${pct}%)</span>
                    </div>
                    <div class="w-full h-3 bg-slate-800 rounded-full overflow-hidden">
                      <div style="width:${Math.max(pct, 4)}%" class="${s.color} h-full rounded-full"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Policy Themes Breakdown -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-1">Bills by Strategic Policy Theme</h3>
            <p class="text-xs text-slate-400 mb-4">Click any policy category to filter bills.</p>
            <div class="space-y-3">
              ${Object.entries(themeCounts).sort((a, b) => b[1] - a[1]).map(([theme, count]) => {
                const pct = Math.round((count / bills.length) * 100);
                return `
                  <div onclick="state.themeFilter = '${escapeHtml(theme)}'; state.activeTab = 'explorer'; render();" class="cursor-pointer group">
                    <div class="flex justify-between text-xs mb-1">
                      <span class="font-medium text-slate-200 group-hover:text-blue-400">${escapeHtml(theme)}</span>
                      <span class="font-mono text-slate-400">${count} bills (${pct}%)</span>
                    </div>
                    <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden">
                      <div style="width:${pct}%" class="bg-indigo-500 h-full rounded-full"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Most Cosponsored Bills -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-3">Highest Bipartisan Momentum (By Cosponsors)</h3>
            <div class="space-y-2.5">
              ${topBills.map(b => {
                const maxC = topBills[0].cosponsorCount || 1;
                const w = Math.round((b.cosponsorCount / maxC) * 100);
                return `
                  <div onclick="openBillModal('${escapeHtml(b.shortNumber)}')" class="cursor-pointer group">
                    <div class="flex justify-between text-xs mb-1">
                      <span class="text-slate-200 group-hover:text-blue-400 truncate max-w-[75%]"><strong>${escapeHtml(b.shortNumber)}</strong> — ${escapeHtml(b.cleanTitle)}</span>
                      <span class="font-mono text-slate-300">${b.cosponsorCount} (${b.totalR}R/${b.totalD}D)</span>
                    </div>
                    <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                      <div style="width:${w}%" class="bg-gradient-to-r from-red-500 via-purple-500 to-blue-500 h-full"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Most Active State Delegations -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
            <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300 mb-1">Most Active State Delegations</h3>
            <p class="text-xs text-slate-400 mb-3">Total sponsorships & cosponsorships across all 49 Taiwan bills by state.</p>
            <div class="grid grid-cols-2 gap-2.5">
              ${topStates.map(([st, count], i) => `
                <div onclick="state.legStateFilter = '${st}'; state.activeTab = 'legislators'; render();" class="cursor-pointer p-2.5 rounded-lg bg-slate-950/60 hover:bg-slate-800 border border-slate-800 flex items-center justify-between transition">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono text-slate-500">#${i + 1}</span>
                    <span class="font-bold text-sm text-white">${escapeHtml(st)}</span>
                  </div>
                  <span class="text-xs font-mono text-blue-400">${count} actions</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderBodyOnly() {
      const container = document.getElementById('bills-results-container');
      if (container) {
        container.innerHTML = renderBillCards(getFilteredBills());
      }
    }

    function renderLegislatorTableOnly() {
      const container = document.getElementById('legislators-table-container');
      if (container) {
        container.innerHTML = renderLegislatorRows(getFilteredLegislators());
      }
    }

    function render() {
      const app = document.getElementById('app');
      const d = state.data;
      if (!d) {
        app.innerHTML = `<div class="p-12 text-center text-slate-400">Loading dataset...</div>`;
        return;
      }

      const passedFirst = d.bills.filter(b => b.stage.key === 'passed_chamber').length;

      app.innerHTML = `
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
          <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div>
              <div class="flex flex-wrap items-center gap-2 mb-1.5">
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
                  <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Live Google Sheet Backend
                </span>
                <span class="text-xs text-slate-400 font-mono">119th U.S. Congress (2025–2026)</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">U.S. Congress Taiwan Bills Tracker</h1>
              <p class="text-xs sm:text-sm text-slate-400 mt-1">
                Powered directly by your <a href="${escapeHtml(d.spreadsheetUrl)}" target="_blank" rel="noopener" class="text-blue-400 hover:underline">Congress Taiwan Bills Google Sheet ↗</a> — preserving your automated Congress.gov API updates.
              </p>
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <button
                onclick="syncFromGoogleSheet()"
                class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition"
              >
                <span>${state.syncing ? '⟳ Syncing Sheet...' : '⟳ Sync from Google Sheet'}</span>
              </button>
              <button
                onclick="exportFilteredCsv()"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition"
              >
                ↓ Export CSV
              </button>
              <a
                href="${escapeHtml(d.spreadsheetUrl)}"
                target="_blank"
                rel="noopener"
                class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-medium transition"
              >
                Open Google Sheet ↗
              </a>
            </div>
          </div>
          ${state.syncStatusMsg ? `<div class="mt-2.5 text-xs text-emerald-400 font-mono">${escapeHtml(state.syncStatusMsg)}</div>` : ''}

          <!-- KPI Strip -->
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-5 pt-5 border-t border-slate-800">
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Tracked Taiwan Bills</div>
              <div class="text-2xl font-extrabold text-white mt-0.5">${d.totalBills}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">${d.bills.filter(b => b.chamber === 'Senate').length} Senate · ${d.bills.filter(b => b.chamber === 'House').length} House</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Enacted / Advanced</div>
              <div class="text-2xl font-extrabold text-emerald-400 mt-0.5">${d.enactedCount} Law <span class="text-sm font-normal text-sky-400">+ ${passedFirst} Passed 1st</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">PL 119-60 (S.1071) & PL 119-45 (H.R.1512)</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Bipartisan Bills</div>
              <div class="text-2xl font-extrabold text-purple-400 mt-0.5">${d.bipartisanCount} <span class="text-sm font-normal text-slate-400">(${Math.round((d.bipartisanCount / d.totalBills) * 100)}%)</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">Cross-party R & D support</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3">
              <div class="text-xs text-slate-400">Companion Bill Pairs</div>
              <div class="text-2xl font-extrabold text-indigo-400 mt-0.5">${d.companionPairsCount} <span class="text-sm font-normal text-slate-400">pairs</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">${d.companionPairsCount * 2} bicameral linked bills</div>
            </div>
            <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 col-span-2 sm:col-span-1">
              <div class="text-xs text-slate-400">Congress Roster</div>
              <div class="text-2xl font-extrabold text-blue-400 mt-0.5">${d.totalLegislators} <span class="text-xs font-normal text-slate-400">(${d.activeLegislatorsCount || 253} active)</span></div>
              <div class="text-[11px] text-slate-500 mt-0.5">Full House & Senate lookup</div>
            </div>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex flex-wrap items-center gap-2 border-b border-slate-800 pb-3">
          ${[
            { id: 'explorer', label: `Bill Explorer (${d.totalBills})` },
            { id: 'companions', label: `Bicameral Companion Pairs (${d.companionPairsCount})` },
            { id: 'legislators', label: `Legislator Leaderboard & Lookup (${d.totalLegislators})` },
            { id: 'dashboard', label: 'Analytics & Pipeline Dashboard' }
          ].map(t => `
            <button
              onclick="state.activeTab = '${t.id}'; render();"
              class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition ${state.activeTab === t.id ? 'bg-blue-600 text-white shadow' : 'bg-slate-900 text-slate-400 hover:text-white hover:bg-slate-800 border border-slate-800'}"
            >${escapeHtml(t.label)}</button>
          `).join('')}
        </div>

        <!-- Tab Body -->
        <div>
          ${state.activeTab === 'explorer' ? renderExplorerTab() : ''}
          ${state.activeTab === 'companions' ? renderCompanionsTab() : ''}
          ${state.activeTab === 'legislators' ? renderLegislatorsTab() : ''}
          ${state.activeTab === 'dashboard' ? renderDashboardTab() : ''}
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
